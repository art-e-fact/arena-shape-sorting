[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-envs"
version = "0.1.0"
description = "Custom IsaacLab-Arena environments for arena-shape-sorting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "isaaclab_arena",
    "junit-xml",
    "build123d",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true