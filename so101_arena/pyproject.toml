[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-so101"
version = "0.1.0"
description = "SO-101 embodiment and leader teleop for Isaac Lab Arena"
requires-python = ">=3.10"
dependencies = [
    "isaaclab_arena",
]

[project.optional-dependencies]
leader = ["lerobot"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arena_so101 = ["embodiments/data/*.usd"]
