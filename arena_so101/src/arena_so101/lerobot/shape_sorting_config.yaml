# Gr00tDatasetConfig for SO-101 shape-sorting MimicGen HDF5 → LeRobot.
#
# Record demos with cameras enabled, e.g.:
#   python -m shape_sorting.generate_policy_demos ... --enable_cameras \
#     --output_file ./datasets/curobo_shape_sorting.hdf5 \
#     shape_sorting_test --embodiment so101_abs_joint
#
# Convert (from the workspace root; wrapper polyfills torchvision.write_video
# and writes every camera in ``cameras``):
#   python -m arena_so101.lerobot.convert_hdf5_to_lerobot \
#     --yaml_file arena_so101/src/arena_so101/lerobot/shape_sorting_config.yaml
#
# Paths below are relative to the pollenating-demo / arena-shape-sorting workspace
# root. After moving arena_so101 to its own repo, point these at the installed
# package files (see arena_so101.lerobot.paths).

data_root: "datasets"
hdf5_name: "curobo_shape_sorting.hdf5"

language_instruction: "Sort the shapes into the box."
task_index: 0
robot_type: "so101"

# MimicGen HDF5 fields (SO-101 abs-joint + Arena camera recorder)
state_name_sim: "joint_pos"
action_name_sim: "processed_actions"

# Dual cameras: wrist ego + fixed over-shoulder external.
# ``pov_cam_name_sim`` / ``video_name_lerobot`` are the primary pair for Arena's
# Gr00tDatasetConfig; ``cameras`` lists every stream the wrapper should write.
pov_cam_name_sim: "camera_ego_rgb"
video_name_lerobot: "observation.images.ego_view"
cameras:
  camera_ego_rgb: "observation.images.ego_view"
  external_camera_rgb: "observation.images.exterior_image"

# LeRobot / GR00T fields
state_name_lerobot: "observation.state"
action_name_lerobot: "action"
task_description_lerobot: "annotation.human.task_description"

chunks_size: 1000
fps: 50

data_path: "data/chunk-{episode_chunk:03d}/episode_{episode_index:06d}.parquet"
video_path: "videos/chunk-{episode_chunk:03d}/{video_key}/episode_{episode_index:06d}.mp4"

modality_template_path: "arena_so101/src/arena_so101/lerobot/modality.json"
modality_fname: "modality.json"
episodes_fname: "episodes.jsonl"
tasks_fname: "tasks.jsonl"
info_template_path: "arena_so101/src/arena_so101/lerobot/info.json"
info_fname: "info.json"

policy_joints_config_path: "arena_so101/src/arena_so101/lerobot/gr00t_6dof_joint_space.yaml"
action_joints_config_path: "arena_so101/src/arena_so101/lerobot/6dof_joint_space.yaml"
state_joints_config_path: "arena_so101/src/arena_so101/lerobot/6dof_joint_space.yaml"

# SO101CameraCfg (height, width, channels) — ego + external share resolution
original_image_size: [480, 640, 3]
target_image_size: [480, 640, 3]
